name: Build NetHunter Pro rootfs

on:
  # Keep this manual-only: builds are privileged, slow, and large enough that
  # automatic push/PR runs on GitHub-hosted runners would be unexpectedly expensive.
  workflow_dispatch:
    inputs:
      device:
        description: Target device to build
        required: true
        type: choice
        default: pinephone
        options:
          - pinephone
          - pinephonepro
          - sdm845
          - r8q
      environment:
        description: Desktop/mobile environment to install
        required: true
        type: choice
        default: phosh
        options:
          - phosh
          - plasma-mobile
      compress:
        description: Compress the generated disk image with xz (-c)
        required: true
        type: boolean
        default: true
      blockmap:
        description: Generate a bmap file for the disk image (-b)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.device }} (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            android-sdk-libsparse-utils \
            bmap-tools \
            binfmt-support \
            ca-certificates \
            curl \
            debootstrap \
            device-tree-compiler \
            gnupg \
            mkbootimg \
            cryptsetup \
            f2fs-tools \
            qemu-user-static \
            rsync \
            squashfs-tools-ng \
            systemd-container \
            xz-utils \
            yq

      - name: Enable ARM64 binfmt/QEMU
        shell: bash
        run: |
          set -euo pipefail
          sudo update-binfmts --enable qemu-aarch64
          sudo systemctl restart systemd-binfmt || true
          test -x /usr/bin/qemu-aarch64-static

      - name: Run build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build.sh
          args=("-t" "${{ inputs.device }}" "-e" "${{ inputs.environment }}")

          if [[ "${{ inputs.compress }}" == 'true' ]]; then
            args+=("-c")
          fi

          if [[ "${{ inputs.blockmap }}" == 'true' ]]; then
            args+=("-b")
          fi

          sudo ./build.sh "${args[@]}"

      - name: List generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -lh .
          ls -lh kali_${{ inputs.environment }}_${{ inputs.device }}_* || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kali-rootfs-${{ inputs.device }}-${{ inputs.environment }}-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: |
            kali_${{ inputs.environment }}_${{ inputs.device }}_*.img
            kali_${{ inputs.environment }}_${{ inputs.device }}_*.img.xz
            kali_${{ inputs.environment }}_${{ inputs.device }}_*.bmap
            kali_${{ inputs.environment }}_${{ inputs.device }}_*.tgz
